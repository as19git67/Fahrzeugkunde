name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    tags:
      # Nur Release-Tags: metadata-action leitet daraus semver-Tags ab; ein
      # beliebiger anderer Tag ergäbe keine Image-Tags und der Push schlüge fehl.
      - 'v*'
  pull_request:
    branches: [ "main" ]

# Zwei gleichzeitige Läufe (z. B. zwei offene PRs) würden sich das :test-Image
# und den Test-Deploy gegenseitig überschreiben. Pro Ref läuft nur ein Lauf;
# ein neuer Push bricht den laufenden ab.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # PRs aus Forks bekommen weder Secrets noch packages:write. Lint und Tests
  # laufen für alle; Registry-Login, Image-Push und Deploy nur, wenn der PR aus
  # diesem Repository kommt (oder es ein Push auf main / ein Release-Tag ist).
  CAN_PUBLISH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # npm ci statt npm install: exakt die Auflösung aus package-lock.json –
      # dieselbe, mit der das Docker-Image gebaut wird (Dockerfile: npm ci).
      - name: Install dependencies
        run: npm ci

      # next build lintet seit Next 16 nicht mehr; ohne diesen Step wären
      # Lint-Fehler in CI unsichtbar.
      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fahrzeugkunde_test
          POSTGRES_TEST_CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/fahrzeugkunde_test

      - name: Set up QEMU
        if: env.CAN_PUBLISH == 'true'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: env.CAN_PUBLISH == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        if: env.CAN_PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: env.CAN_PUBLISH == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=semver,pattern={{version}}
            type=raw,value=test,enable=${{ github.event_name == 'pull_request' }}

      - name: Build and push Docker image
        if: env.CAN_PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64  # linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_NUMBER=${{ github.run_number }}-${{ github.sha }}
          # Layer-Cache über GitHub Actions: PGDG-Install und npm ci werden
          # nicht bei jedem Lauf neu gebaut.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (tags, labels) for backup sidecar image
        if: env.CAN_PUBLISH == 'true'
        id: meta-backup
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backup
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=semver,pattern={{version}}
            type=raw,value=test,enable=${{ github.event_name == 'pull_request' }}

      - name: Build and push backup sidecar Docker image
        if: env.CAN_PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./scripts/backup
          push: true
          platforms: linux/amd64  # linux/arm64
          tags: ${{ steps.meta-backup.outputs.tags }}
          labels: ${{ steps.meta-backup.outputs.labels }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

      - name: Deploy to TrueNAS (test)
        if: github.event_name == 'pull_request' && env.CAN_PUBLISH == 'true'
        run: |
          curl -f -X POST \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            ${{ secrets.WATCHTOWER_URL_TEST }}/v1/update

      - name: Deploy to TrueNAS (latest)
        if: github.ref == 'refs/heads/main'
        run: |
          curl -f -X POST \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            ${{ secrets.WATCHTOWER_URL_PROD }}/v1/update
